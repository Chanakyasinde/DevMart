name: DevMart
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
        
      - name: Run setup script
        run: ./scripts/setup.sh

      - name: Build frontend
        working-directory: ./client
        run: npm run build

      - name: Run backend tests
        working-directory: ./server
        run: npm test
